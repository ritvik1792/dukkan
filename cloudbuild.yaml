# dukkan-build SA needs roles/run.admin and roles/iam.serviceAccountUser
# on PROJECT_NUMBER-compute@developer.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - gcloud
      - run
      - deploy
      - dukkan-api
      - --image=${_IMAGE}
      - --region=asia-south1
      - --platform=managed
      - --quiet
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/PROJECT_ID/dukkan/dukkan-api:latest
