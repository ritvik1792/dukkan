# Shared defaults. Cloud Run stays prod-like via env (DUKKAN_DB_*, JWT, CORS)
# even with no profile. Explicit profiles:
#   local — localhost Postgres + local UI CORS (never Cloud SQL)
#   prod  — Cloud SQL / Secret Manager env only
# Commands: mvn spring-boot:run -Dspring-boot.run.profiles=local|prod

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DUKKAN_DB_URL:jdbc:postgresql://localhost:5432/dukkan}
    username: ${DUKKAN_DB_USER:dukkan}
    password: ${DUKKAN_DB_PASSWORD:dukkan}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 16MB
  mail:
    host: ${DUKKAN_MAIL_HOST:}
    port: ${DUKKAN_MAIL_PORT:587}
    username: ${DUKKAN_MAIL_USERNAME:}
    password: ${DUKKAN_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${DUKKAN_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${DUKKAN_MAIL_SMTP_STARTTLS:true}

app:
  cors:
    # Comma-separated UI origins. Local defaults; Cloud Run must set the live UI origin.
    allowed-origins: ${DUKKAN_CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}
  # Storefront origin for password-reset links. Prefer DUKKAN_PUBLIC_WEB_URL.
  frontend-base-url: ${DUKKAN_PUBLIC_WEB_URL:${DUKKAN_FRONTEND_BASE_URL:http://localhost:3000}}
  # Absolute API origin for generated upload URLs. Empty = use the incoming request.
  public-base-url: ${DUKKAN_PUBLIC_BASE_URL:}
  jwt:
    secret: ${DUKKAN_JWT_SECRET:dukkan-dev-secret-change-before-production-32b}
    expiration-ms: 86400000
  password-reset:
    # Prefer a dedicated secret; falls back to the JWT secret for local dig.
    secret: ${DUKKAN_PASSWORD_RESET_SECRET:${DUKKAN_JWT_SECRET:dukkan-dev-secret-change-before-production-32b}}
    ttl-minutes: ${DUKKAN_PASSWORD_RESET_TTL_MINUTES:45}
  mail:
    from: ${DUKKAN_MAIL_FROM:noreply@pinkcarrot.local}
  requests:
    scheduler-ms: ${DUKKAN_REQUEST_SCHEDULER_MS:15000}
  otp:
    expose-dev-code: ${DUKKAN_OTP_DEV_CODE:false}
    ttl-seconds: 300
    min-resend-seconds: 20
  uploads:
    dir: ${DUKKAN_UPLOAD_DIR:data/uploads}
  nominatim:
    base-url: ${DUKKAN_NOMINATIM_URL:https://nominatim.openstreetmap.org}
    user-agent: ${DUKKAN_NOMINATIM_USER_AGENT:Dukkan/1.0 (in.dukkan marketplace; local-dev)}
    cache-ttl-hours: ${DUKKAN_NOMINATIM_CACHE_TTL_HOURS:24}
    timeout-ms: ${DUKKAN_NOMINATIM_TIMEOUT_MS:8000}
